[build]
  command = "npm run build"
  publish = "dist"

# API proxy (2026-10-07) — this is what makes internal LOGIN work.
#
# The session is an httpOnly cookie, and a cookie is first-party only when the
# API and the site share a registrable domain. With the browser talking to
# `blo-map-api-production.up.railway.app` directly, the cookie was third-party:
# Chrome and Safari dropped it, so login returned 200, flashed, and bounced
# back to /login with a wall of 401s and nothing wrong in the server logs.
#
# Proxying /api/* through this domain means the browser only ever speaks to
# map.blacklandownership.com, so the cookie is first-party and SameSite=Lax
# works everywhere — with no DNS change and no Railway custom domain.
#
# MUST stay ABOVE the SPA catch-all: Netlify matches redirects in order, and
# /* would otherwise swallow /api/* into index.html.
#
# Requires, or it does nothing:
#   Netlify  VITE_API_URL=https://map.blacklandownership.com   (inlined at BUILD
#            time — use "Clear cache and deploy site")
#   Railway  TRUST_PROXY_HOPS=2        (Netlify is now a second hop; must match
#            reality or per-IP limits are spoofable)
#   Railway  SESSION_COOKIE_SAMESITE=lax
#
# Leave OAUTH_ISSUER pointing at the railway.app host: OAuth clients (MCP)
# connect to the API directly and are unaffected by this proxy.
[[redirects]]
  from = "/api/*"
  to = "https://blo-map-api-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Internal-only routes (P5-5): the login page and account page are part of
# the public SPA bundle by necessity, but search engines have no business
# indexing them — keep the internal library entrance out of search results.
[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/account"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Hashed build assets never change — cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# County datasets are large and change only on data refreshes; a day of
# caching keeps repeat visits fast without pinning stale data for long.
[[headers]]
  for = "/datasets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# P5-90: the prebuilt county files are named by the hash of their contents
# (scripts/build-datasets.mjs), so a given URL can never change. Cache them
# the way hashed JS is cached — forever. A data refresh publishes new names
# and the bundle asks for those instead.
# The more specific path wins over the /datasets/* rule above.
[[headers]]
  for = "/datasets/build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
